name: Staging WordPress.org Plugin Deployment

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: Confirm installation and activation of plugins on staging
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-plugin-deployment
  cancel-in-progress: false

jobs:

  deploy:

    name: Deploy WordPress.org plugins
    runs-on: ubuntu-latest
    environment: staging

    env:
      REMOTE_DIR: /tmp/gwaramedia-wporg-deploy-${{ github.run_id }}-${{ github.run_attempt }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Require deployment confirmation
        shell: bash
        env:
          CONFIRM_DEPLOYMENT: ${{ inputs.confirm_deployment }}
        run: |
          if [[ "$CONFIRM_DEPLOYMENT" != "true" ]]; then
            echo "Deployment was not confirmed."
            exit 1
          fi


      - name: Validate plugin manifests
        run: bash scripts/validate.sh


      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts


      - name: Create temporary deployment directory
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$REMOTE_DIR'"


      - name: Upload deployment files
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          scp \
            -i ~/.ssh/deploy_key \
            -P "$SSH_PORT" \
            -r \
            manifests \
            scripts \
            "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"


      - name: Run staging preflight
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          WP_PATH: ${{ vars.WP_PATH }}
          EXPECTED_SITE_URL: ${{ vars.EXPECTED_SITE_URL }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "WP_PATH='$WP_PATH' EXPECTED_SITE_URL='$EXPECTED_SITE_URL' bash '$REMOTE_DIR/scripts/preflight.sh'"


      - name: Revalidate deployment plan without changes
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          WP_PATH: ${{ vars.WP_PATH }}
          EXPECTED_SITE_URL: ${{ vars.EXPECTED_SITE_URL }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "WP_PATH='$WP_PATH' EXPECTED_SITE_URL='$EXPECTED_SITE_URL' bash '$REMOTE_DIR/scripts/deploy.sh'"


      - name: Deploy WordPress.org plugins
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          WP_PATH: ${{ vars.WP_PATH }}
          EXPECTED_SITE_URL: ${{ vars.EXPECTED_SITE_URL }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "WP_PATH='$WP_PATH' EXPECTED_SITE_URL='$EXPECTED_SITE_URL' bash '$REMOTE_DIR/scripts/deploy-wporg.sh'"


      - name: Cleanup
        if: always()
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "rm -rf '$REMOTE_DIR'" || true
