name: Staging Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  preflight:

    name: Check staging server
    runs-on: ubuntu-latest
    environment: staging

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts


      - name: Test SSH connection
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'echo "SSH CONNECTION OK" && whoami && hostname'


      - name: Upload preflight script
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          scp \
            -i ~/.ssh/deploy_key \
            -P "$SSH_PORT" \
            scripts/preflight.sh \
            "$SSH_USER@$SSH_HOST:/tmp/gwaramedia-preflight.sh"


      - name: Run WordPress preflight
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}

          WP_PATH: ${{ vars.WP_PATH }}
          EXPECTED_SITE_URL: ${{ vars.EXPECTED_SITE_URL }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "WP_PATH='$WP_PATH' EXPECTED_SITE_URL='$EXPECTED_SITE_URL' bash /tmp/gwaramedia-preflight.sh"


      - name: Remove temporary script
        if: always()
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'rm -f /tmp/gwaramedia-preflight.sh' || true
